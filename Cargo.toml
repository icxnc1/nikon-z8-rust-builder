[package]
name = "nikon-z8-rust-builder"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native cross-platform Nikon Z8 v0.5.1 offline builder, verifier and local dashboard"

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[profile.release]
overflow-checks = true
lto = "thin"
panic = "abort"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
